resolver 127.0.0.11 valid=5s;
server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 64m;
    root /usr/share/nginx/html;
    index index.html;
    set $api_backend http://api:8000;
    location /api/ {
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /health/ { proxy_pass $api_backend$request_uri; }
    location /docs { proxy_pass $api_backend$request_uri; }
    location /openapi.json { proxy_pass $api_backend$request_uri; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
