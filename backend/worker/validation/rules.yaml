# Конфигурация rule engine.
# YAML задаёт метаданные и параметры; каждый type должен иметь обработчик в коде.
# Правила взяты из реестра issue #6; этот файл сам по себе их не исполняет.
# Статусы draft исключены из запуска; ready и ready_with_semantic_fallback запускаются.

schema_version: 2

# До графа правила проверяют набор распарсенных JSON. После решений пользователя
# та же логика запускается на проекции проверяемой версии графа.
phases:
  document_reconciliation:
    input: parsed_documents
  graph_validation:
    input: graph_projection

rules:
  - id: "R-03"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Внутренняя сумма часов"
    type: "sum_components_equals_total"
    status: "ready"
    required_for_confirmation: false
    scope:
      document_types: ["rpd"]
      records_path: "$.disciplines[*]"
    inputs:
      total_hours_field: "hours_total"
      components_field: "hours_by_kind"
      include_component_keys:
        - "лекции"
        - "семинары"
        - "консультации"
        - "практические занятия"
        - "лабораторные работы"
        - "контрольные работы"
        - "коллоквиумы"
        - "текущий контроль"
        - "промежуточная аттестация"
        - "итоговая аттестация"
        - "под руководством преподавателя"
        - "в присутствии преподавателя"
        - "сам.раб. с использованием методических материалов"
        - "текущий контроль (сам.раб.)"
        - "промежуточная аттестация (сам.раб.)"
        - "итоговая аттестация (сам.раб.)"
        - "в т. ч. с использованием учебно-методич. материалов (сам.раб.)"
      exclude_component_keys:
        - "объём активных и интерактивных форм учебных занятий"
        - "трудоёмкость (ЗЕТ, дубль)"
    basis:
      kind: "project_consistency_rule"
      issue: 6
      rule_id: "R-03"
      reference: "РПД/РПП, раздел 2.1"
    notes: >-
      Суммируются независимые виды нагрузки из hours_by_kind.
      Справочные часы активных форм и ЗЕТ в сумму не входят.
      Неизвестный компонент требует needs_review.

  - id: "R-05"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Согласованность ЗЕТ между РПД и учебным планом"
    type: "compare_fields_across_documents"
    status: "ready"
    required_for_confirmation: false
    inputs:
      left:
        document_type: "rpd"
        records_path: "$.disciplines[*]"
        name_field: "name"
        semester_field: "semesters"
        value_field: "credit_units"
      right:
        document_type: "curriculum"
        records_path: "$.curriculum_items[*]"
        name_field: "discipline_name"
        semester_field: "semester"
        value_field: "credit_units"
      matching:
        name: "equal"
        semester: "right_value_in_left_list"
      comparison: "equal"
    basis:
      kind: "project_consistency_rule"
      issue: 6
      rule_id: "R-05"
      reference: "РПД, шапка и раздел 2.1; учебный план, раздел 2"
    notes: >-
      Это только междокументная часть R-05. Проверки согласованности ЗЕТ
      внутри РПД и сумм по семестрам РПП в этот черновик не входят.
      Сравниваются только односеместровые РПД; неполнота требует needs_review.

  - id: "R-01"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Согласованность кодов компетенций и связей дисциплин (без матрицы)"
    type: "competency_consistency"
    status: "ready"
    match_threshold: 0.94  # Порог предложения кандидата; соответствие подтверждает пользователь.
    notes: >-
      Проверяет ссылки на существующие коды и соответствие явных связей
      учебного плана и РПД/РПП по названию и семестру. Отсутствие кода
      в неполном каталоге ЦКМВ/характеристики требует ручной проверки;
      непредставленные дисциплины не считаются ошибками.
      Дополнительно предлагает возможные соответствия различных кодов
      при высокой схожести формулировок (настраиваемый порог 0.94); хранит все источники; пользователь подтверждает
      или отклоняет кандидата. Автоматическое объединение запрещено.

  - id: "R-07"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Сопоставление формулировок компетенций с одинаковым кодом"
    type: "competency_formulations"
    status: "ready_with_semantic_fallback"
    llm:
      model_env: "VALIDATION_LLM_MODEL"
      api_key_env: "VALIDATION_LLM_API_KEY"
      api_base_env: "VALIDATION_LLM_API_BASE"
      timeout_seconds: 45
      max_tokens: 2400
      max_calls_per_run: 50
      max_group_variants: 8
    notes: >-
      Сравнивает все варианты одного кода между документами одним событием проверки, включая
      РПД, РПП, ЦКМВ, характеристику и матрицу, без автоматического эталона.
      Различия только в регистре, пробелах и конечной пунктуации допустимы.
      LLM описывает смысловые и грамматические различия, включая добавленный
      уровень; при её недоступности требуется ручное ревью.
      Разные варианты одного кода сравниваются одним групповым запросом;
      на один запуск ограничено 50 запросов, в группе — до 8 уникальных
      формулировок. Превышение лимитов переводит сравнения в uncertain для ручного ревью.
      Выбор формулировки делает пользователь, разные коды не объединяются.

  - id: "R-08-local-reference"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Ссылка индикатора на существующую компетенцию внутри документа"
    type: "reference_exists"
    status: "ready"
    scope:
      document_types: ["rpd", "rpp", "ckmv"]
    inputs:
      source_records_path: "$.indicators[*]"
      source_value_field: "competency_code"
      target_records_path: "$.competencies[*]"
      target_key_field: "code"
      on_missing: "report_integrity_error"
    basis:
      kind: "partial_structural_check"
      issue: 6
      rule_id: "R-08 (частичная проверка ссылок)"
      reference: "Связь индикатора с компетенцией в JSON РПД"
    notes: >-
      Проверяет только наличие competency_code среди competencies[].code в том же
      JSON. В текущем JSON РПД все такие ссылки находятся. Это не проверка
      формулировок и кодов индикаторов относительно ЦКМВ.

  - id: "R-08-semantic"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Смысловая согласованность индикаторов с одинаковым кодом"
    type: "semantic_indicator_consistency"
    status: "ready_with_semantic_fallback"
    scope:
      document_types: ["rpd", "rpp", "ckmv"]
    inputs:
      indicators_path: "$.indicators[*]"
      competencies_path: "$.competencies[*]"
    llm:
      model_env: "VALIDATION_LLM_MODEL"
      api_key_env: "VALIDATION_LLM_API_KEY"
      api_base_env: "VALIDATION_LLM_API_BASE"
      prompt_version: "r08-v1"
      timeout_seconds: 60
      max_tokens: 2400
      disable_thinking: true
    basis:
      kind: "project_consistency_rule"
      issue: 6
      rule_id: "R-08"
      reference: "Сопоставление описаний индикатора и родительской компетенции в документах одного пакета"
    notes: >-
      Группирует индикаторы по коду в пределах одной программы и сравнивает
      формулировки и контекст родительской компетенции в РПД, РПП и ЦКМВ.
      Совпадающие после нормализации формулировки и родительские компетенции
      проходят без вызова LLM. Для различающихся данных LLM определяет только
      смысловую эквивалентность, существенное различие или неопределённость.
      Эталонный текст не назначается; различие и неопределённость требуют
      экспертной проверки и не являются нормативным нарушением.

  - id: "R-11"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Смысловая связь результатов обучения с содержанием и оцениванием в РПД"
    type: "semantic_rpd_alignment"
    status: "draft"
    scope:
      document_types: ["rpd"]
    inputs:
      disciplines_path: "$.disciplines[*]"
      learning_outcomes_path: "$.learning_outcomes[*]"
      course_content_path: "$.course_content[*]"
      indicators_path: "$.indicators[*]"
      assessment_tools_path: "$.assessment_tools[*]"
      relations_path: "$.relations[*]"
    llm:
      model_env: "VALIDATION_LLM_MODEL"
      api_key_env: "VALIDATION_LLM_API_KEY"
      api_base_env: "VALIDATION_LLM_API_BASE"
      prompt_version: "r11-v1"
      timeout_seconds: 60
      max_tokens: 4000
      # Qwen3 на vLLM: без отключения модель тратит max_tokens на reasoning
      # и возвращает пустой content. false возвращает прежнее поведение.
      disable_thinking: true
    basis:
      kind: "project_semantic_rule"
      issue: 6
      rule_id: "R-11"
      reference: "РПД: результаты обучения; раздел 2 — содержание занятий; раздел 3 — индикаторы и оценочные средства"
    notes: >-
      Для каждого результата обучения внутри одной РПД модель оценивает,
      поддержан ли он содержанием раздела 2 и связанными через компетенцию и
      индикатор данными об оценивании из раздела 3. Вывод LLM не считается
      нормативным нарушением: пробелы, неопределённость, отсутствие контекста
      или недоступность модели требуют экспертной проверки. Нужны переменные
      VALIDATION_LLM_MODEL и VALIDATION_LLM_API_KEY; VALIDATION_LLM_API_BASE необязателен.

  - id: "R-06"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Поиск дубликатов внутри списков сущностей"
    type: "unique_by_fields"
    status: "ready"
    required_for_confirmation: false
    inputs:
      collections:
        - records_path: "$.competencies[*]"
          key_fields: ["code"]
        - records_path: "$.indicators[*]"
          key_fields: ["code"]
        - records_path: "$.relations[*]"
          key_fields:
            - "src_entity"
            - "src_key"
            - "dst_entity"
            - "dst_key"
            - "kind"
    basis:
      kind: "project_consistency_rule"
      issue: 6
      rule_id: "R-06"
      reference: "РПД, раздел 1.3; матрица компетенций; ЦКМВ"


  # Правила, не использующие матрицу компетенций.
  - id: "R-02"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Сверка часов учебного плана и РПД/РПП"
    type: "hours_against_curriculum"
    status: "ready"
    required_for_confirmation: false
    notes: "Для РПП сравнивается нагрузка конкретного семестра; для РПД — только односеместровая запись. Неоднозначность или нехватка данных требуют needs_review."

  - id: "R-04"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Соответствие ЗЕТ и часов"
    type: "credit_hours"
    status: "ready"
    inputs:
      hours_per_credit_unit: 36
    notes: "Для проекта утверждено значение 36 часов на 1 ЗЕТ."

  - id: "R-05-title"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Согласованность ЗЕТ титула и таблицы нагрузки"
    type: "title_credit_units"
    status: "ready"
    required_for_confirmation: false

  - id: "R-03-RPP"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Сумма нагрузки практики по семестрам"
    type: "semester_workload_totals"
    status: "ready"
    required_for_confirmation: false
    notes: "Проверяется сумма часов и ЗЕТ по semester_workload против общего итога одной практики РПП. Несколько практик без распределения нагрузки требуют needs_review."

  - id: "R-09"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Покрытие компетенций по полному учебному плану"
    type: "competency_coverage"
    status: "draft"
    inputs:
      curriculum_is_complete: false
    notes: "Выключено до подтверждения полноты учебного плана и обязательного перечня компетенций: неполный образец не должен давать ложные ошибки."

  - id: "R-10"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Связь результатов обучения с индикаторами"
    type: "outcome_indicator_links"
    status: "ready"
    required_for_confirmation: false
    notes: "В ЦКМВ используются явные indicator_outcome_links; в РПД/РПП допускается опосредованная связь через компетенцию."

  - id: "R-15"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Принадлежность индикатора компетенции по коду"
    type: "indicator_hierarchy"
    status: "ready"
    required_for_confirmation: false
    notes: "Проверяется префикс и числовой суффикс. Пропуски номеров и ведущие нули допустимы по образцу. Обратный порядок в одном разделе требует ручной проверки."


  - id: "R-13"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Обязательные разделы ЦКМВ"
    type: "required_sections"
    status: "ready"
    required_for_confirmation: false
    inputs:
      required_sections:
        - "Профессиональные компетенции базового уровня"
        - "Профессиональные перекрестные компетенции базового уровня"
        - "Профессиональные перекрестные компетенции топ-уровня"
        - "Профессиональные ключевые компетенции для программ топ-уровня"
    notes: "Пилотный перечень по образцу ЦКМВ; не универсальная норма. Отсутствие свидетельств в source_ref.section требует ручной проверки."

  - id: "R-14"
    phases: ["document_reconciliation", "graph_validation"]
    name: "Язык обучения дисциплины и программы"
    type: "education_language"
    status: "ready"
    required_for_confirmation: false
    notes: "Проверяется при наличии явно указанных языков в РПД/РПП и характеристике."
