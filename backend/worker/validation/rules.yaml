schema_version: 1

rules:
  - id: "R-03"
    name: "Внутренняя сумма часов"
    type: "sum_components_equals_total"
    status: "draft"
    scope:
      document_types: ["rpd"]
      records_path: "$.disciplines[*]"
    inputs:
      total_hours_field: "hours_total"
      components_field: "hours_by_kind"
      include_component_keys:
        - "лекции"
        - "консультации"
        - "практические занятия"
        - "контрольные работы"
        - "коллоквиумы"
        - "промежуточная аттестация"
        - "сам.раб. с использованием методических материалов"
        - "промежуточная аттестация (сам.раб.)"
      exclude_component_keys:
        - "объём активных и интерактивных форм учебных занятий"
        - "трудоёмкость (ЗЕТ, дубль)"
    basis:
      kind: "project_consistency_rule"
      issue: 6
      rule_id: "R-03"
      reference: "РПД/РПП, раздел 2.1"
    notes: >-
      Список компонентов соответствует имеющемуся примеру РПД и требует
      сверки с остальными шаблонами документов перед включением правила.

  - id: "R-05"
    name: "Согласованность ЗЕТ между РПД и учебным планом"
    type: "compare_fields_across_documents"
    status: "draft"
    inputs:
      left:
        document_type: "rpd"
        records_path: "$.disciplines[*]"
        name_field: "name"
        semester_field: "semesters"
        value_field: "credit_units"
      right:
        document_type: "curriculum"
        records_path: "$.curriculum_items[*]"
        name_field: "discipline_name"
        semester_field: "semester"
        value_field: "credit_units"
      matching:
        name: "equal"
        semester: "right_value_in_left_list"
      comparison: "equal"
    basis:
      kind: "project_consistency_rule"
      issue: 6
      rule_id: "R-05"
      reference: "РПД, шапка и раздел 2.1; учебный план, раздел 2"
    notes: >-
      Это только междокументная часть R-05. Проверки согласованности ЗЕТ
      внутри РПД и сумм по семестрам РПП в этот черновик не входят.

  - id: "R-01"
    name: "Согласованность кодов компетенций и связей дисциплин (без матрицы)"
    type: "competency_consistency"
    status: "ready"
    notes: >-
      Проверяет ссылки на существующие коды и соответствие явных связей
      учебного плана и РПД/РПП по названию и семестру. Отсутствие кода
      в неполном каталоге ЦКМВ/характеристики требует ручной проверки;
      непредставленные дисциплины не считаются ошибками.

  - id: "R-07"
    name: "Согласованность формулировок компетенций (без матрицы)"
    type: "competency_formulations"
    status: "ready_with_semantic_fallback"
    llm:
      model_env: "VALIDATION_LLM_MODEL"
      api_key_env: "VALIDATION_LLM_API_KEY"
      api_base_env: "VALIDATION_LLM_API_BASE"
    notes: >-
      Сравнивает одинаковые коды с приоритетом ЦКМВ, затем характеристики.
      Различия только в регистре, пробелах и конечной пунктуации допустимы.
      Существенные различия оцениваются LLM при наличии конфигурации,
      иначе помечаются для ручного ревью; разные коды не отождествляются.

  - id: "R-08-local-reference"
    name: "Ссылка индикатора на существующую компетенцию внутри РПД"
    type: "reference_exists"
    status: "draft"
    scope:
      document_types: ["rpd", "rpp", "ckmv"]
    inputs:
      source_records_path: "$.indicators[*]"
      source_value_field: "competency_code"
      target_records_path: "$.competencies[*]"
      target_key_field: "code"
      on_missing: "report_integrity_error"
    basis:
      kind: "partial_structural_check"
      issue: 6
      rule_id: "R-08 (частичная проверка ссылок)"
      reference: "Связь индикатора с компетенцией в JSON РПД"
    notes: >-
      Проверяет только наличие competency_code среди competencies[].code в том же
      JSON. В текущем JSON РПД все такие ссылки находятся. Это не проверка
      формулировок и кодов индикаторов относительно ЦКМВ.

  - id: "R-11"
    name: "Смысловая связь результатов обучения с содержанием и оцениванием в РПД"
    type: "semantic_rpd_alignment"
    status: "draft"
    scope:
      document_types: ["rpd"]
    inputs:
      disciplines_path: "$.disciplines[*]"
      learning_outcomes_path: "$.learning_outcomes[*]"
      course_content_path: "$.course_content[*]"
      indicators_path: "$.indicators[*]"
      assessment_tools_path: "$.assessment_tools[*]"
      relations_path: "$.relations[*]"
    llm:
      model_env: "VALIDATION_LLM_MODEL"
      api_key_env: "VALIDATION_LLM_API_KEY"
      api_base_env: "VALIDATION_LLM_API_BASE"
      timeout_seconds: 60
      max_tokens: 4000
      # Qwen3 на vLLM: без отключения модель тратит max_tokens на reasoning
      # и возвращает пустой content. false возвращает прежнее поведение.
      disable_thinking: true
    basis:
      kind: "project_semantic_rule"
      issue: 6
      rule_id: "R-11"
      reference: "РПД: результаты обучения; раздел 2 — содержание занятий; раздел 3 — индикаторы и оценочные средства"
    notes: >-
      Для каждого результата обучения внутри одной РПД модель оценивает,
      поддержан ли он содержанием раздела 2 и связанными через компетенцию и
      индикатор данными об оценивании из раздела 3. Вывод LLM не считается
      нормативным нарушением: пробелы, неопределённость, отсутствие контекста
      или недоступность модели требуют экспертной проверки. Нужны переменные
      VALIDATION_LLM_MODEL и VALIDATION_LLM_API_KEY; VALIDATION_LLM_API_BASE необязателен.

  - id: "R-06"
    name: "Поиск дубликатов внутри списков сущностей"
    type: "unique_by_fields"
    status: "draft"
    inputs:
      collections:
        - records_path: "$.competencies[*]"
          key_fields: ["code"]
        - records_path: "$.indicators[*]"
          key_fields: ["code"]
        - records_path: "$.relations[*]"
          key_fields:
            - "src_entity"
            - "src_key"
            - "dst_entity"
            - "dst_key"
            - "kind"
    basis:
      kind: "project_consistency_rule"
      issue: 6
      rule_id: "R-06"
      reference: "РПД, раздел 1.3; матрица компетенций; ЦКМВ"


  # Правила, не использующие матрицу компетенций.
  - id: "R-02"
    name: "Сверка часов учебного плана и РПД/РПП"
    type: "hours_against_curriculum"
    status: "draft"
    notes: "Для РПП сравнивается нагрузка конкретного семестра; для РПД — только односеместровая запись."

  - id: "R-04"
    name: "Соответствие ЗЕТ и часов"
    type: "credit_hours"
    status: "draft"
    notes: "36 часов на 1 ЗЕТ — принятое для проекта допущение, нормативное основание требует подтверждения."

  - id: "R-03-RPP"
    name: "Сумма нагрузки практики по семестрам"
    type: "semester_workload_totals"
    status: "draft"
    notes: "Проверяется сумма часов и ЗЕТ по semester_workload против общего итога РПП."

  - id: "R-09"
    name: "Покрытие компетенций по полному учебному плану"
    type: "competency_coverage"
    status: "draft"
    inputs:
      curriculum_is_complete: false
    notes: "Выключено до подтверждения полноты учебного плана и обязательного перечня компетенций: неполный образец не должен давать ложные ошибки."

  - id: "R-10"
    name: "Связь результатов обучения с индикаторами"
    type: "outcome_indicator_links"
    status: "draft"
    notes: "В ЦКМВ используются явные indicator_outcome_links; в РПД/РПП допускается опосредованная связь через компетенцию."

  - id: "R-15"
    name: "Принадлежность индикатора компетенции по коду"
    type: "indicator_hierarchy"
    status: "draft"
    notes: "Структурная часть: проверяется префикс кода; семантическая корректность и порядок уровней требуют отдельной проверки."


  - id: "R-13"
    name: "Обязательные разделы ЦКМВ"
    type: "required_sections"
    status: "draft"
    inputs:
      required_sections: []
    notes: "До утверждения перечня разделов и появления document_sections в ЦКМВ проверка пропускается."

  - id: "R-14"
    name: "Язык обучения дисциплины и программы"
    type: "education_language"
    status: "draft"
    notes: "Проверяется при наличии явных education_languages; текущий контракт v2 пока не содержит этих полей."
