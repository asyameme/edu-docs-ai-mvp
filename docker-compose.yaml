name: education-backend

x-backend: &backend
  image: education-backend:stage2
  environment: &backend-env
    POSTGRES_HOST: postgres
    POSTGRES_DB: education
    POSTGRES_USER: education
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD}
    TEMPORAL_DB_USER: education_temporal
    TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: education
    TEMPORAL_TASK_QUEUE: education-default
    CHROMA_URL: http://chroma:8000
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
    PARSER_URL: ${PARSER_URL:-}
    ANALYSIS_URL: ${ANALYSIS_URL:-http://analysis:8001}
    ANALYSIS_ORIGINAL_BASE_URL: ${ANALYSIS_ORIGINAL_BASE_URL:-http://api:8000}
    ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
    ANALYSIS_MAX_REQUEST_BYTES: ${ANALYSIS_MAX_REQUEST_BYTES:-20971520}
    ANALYSIS_MAX_RESPONSE_BYTES: ${ANALYSIS_MAX_RESPONSE_BYTES:-10485760}
    ARTIFACT_FILES_PATH: /data/artifacts
  restart: unless-stopped

services:
  analysis:
    build: ./backend
    image: education-backend:stage2
    command:
      - uvicorn
      - worker.analysis_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      ANALYSIS_ORIGINAL_BASE_URL: http://api:8000
    expose:
      - "8001"
    restart: unless-stopped
  frontend:
    image: education-frontend:stage2
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    <<: *backend
    build: ./backend
    volumes:
      - artifact-files:/data/artifacts:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      temporal-namespace-init:
        condition: service_completed_successfully
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 15s
    volumes:
      - artifact-files:/data/artifacts
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      temporal-namespace-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker_health"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: education
      POSTGRES_USER: education
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data
    restart: unless-stopped

  app-migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    # Старый том нужен только миграции 0003; она читает его без удаления файлов.
    volumes:
      - original-files:/data/originals:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal-db-init:
    <<: *backend
    user: "0"
    restart: "no"
    command: ["python", "-m", "scripts.prepare_temporal_db"]
    volumes:
      - temporal-init-state:/init-state
    depends_on:
      postgres:
        condition: service_healthy

  temporal-schema-init:
    image: temporalio/admin-tools:1.32.1
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    environment:
      POSTGRES_USER: education_temporal
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
    volumes:
      - ./backend/temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
      - temporal-init-state:/init-state:ro
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    restart: "no"

  temporal:
    image: temporalio/server:1.32.1
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: education_temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./backend/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    depends_on:
      temporal-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  temporal-namespace-init:
    image: temporalio/admin-tools:1.32.1
    entrypoint: ["/bin/sh", "/scripts/setup-namespace.sh"]
    volumes:
      - ./backend/temporal/setup-namespace.sh:/scripts/setup-namespace.sh:ro
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.57.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: education
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal-namespace-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  chroma-data:
  temporal-init-state:
  original-files:
  artifact-files:
